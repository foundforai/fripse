name = "fripse"
main = "worker.ts"
compatibility_date = "2026-08-12"
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[send_email]]
name = "EMAIL"
allowed_destination_addresses = ["info@fripse.com"]

[[routes]]
pattern = "fripseai.com/*"
zone_name = "fripseai.com"

[[routes]]
pattern = "www.fripseai.com/*"
zone_name = "fripseai.com"

[[routes]]
pattern = "fripse.com/*"
zone_name = "fripse.com"

[[routes]]
pattern = "www.fripse.com/*"
zone_name = "fripse.com"
